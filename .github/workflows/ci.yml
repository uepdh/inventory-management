# Automated build and test (Circana 10 Engineering Rules: a passing run is required to merge).
# Runs on every pull request and on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend API tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt pytest pytest-asyncio httpx
      - run: python -m pytest -q
        working-directory: tests

  frontend-build:
    name: Frontend production build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # package-lock.json is deliberately not committed (see CLAUDE.md), so npm install, not npm ci.
      - run: npm install --no-audit --no-fund
        working-directory: client
      - run: npm run build
        working-directory: client
